# SSMTP Configuration for email testing
# This allows the PHP container to send emails for testing

# Mail server configuration
mailhub=mailhog:1025

# Set the person who gets all mail for userids < 1000
root=postmaster

# The full hostname
hostname=php-container

# Are users allowed to set their own From: address?
FromLineOverride=YES

# Use TLS before starting negotiation
UseTLS=NO
UseSTARTTLS=NO
