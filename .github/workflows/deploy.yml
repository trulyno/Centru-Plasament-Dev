name: Deploy PHP Website to Render

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Test locally
      run: |
        docker compose up -d
        sleep 15
        curl -f http://localhost:80 || exit 1
        docker compose down -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Optimize Dockerfile for Render
      run: |
        # Create nginx config for single container deployment
        cat > nginx-render.conf << 'EOF'
        server {
            listen 80;
            server_name _;
            root /var/www/html;
            index index.php index.html index.htm;

            # Remove default nginx config
            location / {
                try_files $uri $uri/ /index.php?$query_string;
            }

            # Cache static assets for better performance
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header Vary Accept-Encoding;
                access_log off;
            }

            location ~ \.php$ {
                try_files $uri =404;
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param PATH_INFO $fastcgi_path_info;
                include fastcgi_params;
            }

            location ~ /\.ht {
                deny all;
            }

            # Deny access to sensitive files
            location ~ /\.(git|svn|env) {
                deny all;
            }
        }
        EOF
        
        cat > Dockerfile << 'EOF'
        FROM php:8.2-fpm-alpine
        
        # Install nginx and other dependencies
        RUN apk add --no-cache nginx curl
        
        # Copy source files
        COPY src/ /var/www/html/
        
        # Remove default nginx configurations and copy our custom one
        RUN rm -f /etc/nginx/nginx.conf /etc/nginx/conf.d/* /etc/nginx/http.d/*
        COPY nginx-render.conf /etc/nginx/http.d/default.conf
        
        # Create a minimal nginx.conf
        RUN echo 'user nginx;' > /etc/nginx/nginx.conf && \
            echo 'worker_processes auto;' >> /etc/nginx/nginx.conf && \
            echo 'error_log /var/log/nginx/error.log notice;' >> /etc/nginx/nginx.conf && \
            echo 'pid /var/run/nginx.pid;' >> /etc/nginx/nginx.conf && \
            echo 'events { worker_connections 1024; }' >> /etc/nginx/nginx.conf && \
            echo 'http { include /etc/nginx/mime.types; include /etc/nginx/http.d/*.conf; }' >> /etc/nginx/nginx.conf
        
        # Set permissions
        RUN chown -R www-data:www-data /var/www/html
        RUN chmod -R 755 /var/www/html
        
        # Create directories for nginx
        RUN mkdir -p /run/nginx /var/log/nginx
        
        # Create startup script
        RUN echo '#!/bin/sh' > /start.sh && \
            echo 'php-fpm -D' >> /start.sh && \
            echo 'nginx -g "daemon off;"' >> /start.sh && \
            chmod +x /start.sh
        
        EXPOSE 80
        CMD ["/start.sh"]
        EOF

    - name: Deploy to Render
      run: |
        echo "Triggering deployment to Render..."
        
        # Create deployment using Render API
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "serviceId": "${{ secrets.RENDER_SERVICE_ID }}",
            "clearCache": "clear"
          }' \
          https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
          
        echo "Deployment initiated successfully!"
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

    - name: Wait for deployment to complete
      run: |
        echo "Waiting for deployment to complete..."
        sleep 30
        
        # Check deployment status
        for i in {1..10}; do
          STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }} | \
            grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
          
          echo "Deployment status: $STATUS"
          
          if [ "$STATUS" = "live" ]; then
            echo "✅ Deployment completed successfully!"
            break
          elif [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ]; then
            echo "❌ Deployment failed with status: $STATUS"
            exit 1
          fi
          
          echo "Still deploying... waiting 30 seconds"
          sleep 30
        done
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

    - name: Test deployed website
      run: |
        echo "Testing deployed website..."
        sleep 10
        
        # Test if the website is accessible
        curl -f https://${{ secrets.RENDER_SERVICE_NAME }}.onrender.com || (
          echo "Website not accessible, checking status..."
          curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}
          exit 1
        )
        
        echo "✅ Website is live and accessible!"
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        RENDER_SERVICE_NAME: ${{ secrets.RENDER_SERVICE_NAME }}

    - name: Create deployment summary
      run: |
        echo "🚀 Deployment Summary:"
        echo "Platform: Render"
        echo "Status: ✅ Success"
        echo "URL: https://${{ secrets.RENDER_SERVICE_NAME }}.onrender.com"
        echo "Service ID: ${{ secrets.RENDER_SERVICE_ID }}"
        echo "Deployed at: $(date)"
      env:
        RENDER_SERVICE_NAME: ${{ secrets.RENDER_SERVICE_NAME }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
